<section class="values" id="values">
  <div class="value-wrapper">
    <div class="values-top">
      <div class="value-titles">
        <span class="subheading">{{ valuesData?.subheading }}</span>
        <h2>{{ valuesData?.title }}</h2>
      </div>
      <p class="values-intro" [innerHTML]="valuesData?.description">
      </p>
    </div>
    
    <div class="values-grid">
      @for (card of valuesData?.cards; track card._id) {
        <div class="value-card">
          <div class="value-icon"><i [class]="card.icon"></i></div>
          <h3>{{ card.title }}</h3>
          <p [innerHTML]="card.text"></p>
        </div>
      }
    </div>
  </div>
</section>
