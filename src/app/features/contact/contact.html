<section class="contact" id="contact">
  <div class="contact-wrapper">
    <div *ngIf="contactInfo; else contactInfoLoading" class="contact-info">
      <h2>Get In Touch</h2>
      <p class="contact-desc">
        Our experts are ready to guide you toward your next premium investment or luxury home.
      </p>
      <div class="contact-details">
        <div class="contact-method">
          <i class="ri-phone-line"></i>
          <span>{{ contactInfo.phoneNumber }}</span>
        </div>
        <div class="contact-method">
          <i class="ri-mail-line"></i>
          <span>{{ contactInfo.email }}</span>
        </div>
        <div class="contact-method">
          <i class="ri-map-pin-line"></i>
          <span>{{ contactInfo.address }}</span>
        </div>
      </div>
      <div class="map-preview">
        <a href="https://www.google.com/maps" target="_blank">
          <img [src]="contactInfo.mapImage" alt="Location Map Preview" />
        </a>
      </div>
    </div>

    <ng-template #contactInfoLoading>
      <div class="contact-info placeholder">
        <div class="placeholder-box">Loading contact details...</div>
      </div>
    </ng-template>

    <div class="contact-form-box">
      @if (submitted) {
        <div class="success-message">
          <p>&#x263B; Your inquiry has been sent successfully!</p>
        </div>
      }
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="formData.fullName" placeholder="e.g. Noureldin Mahmoud" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="formData.email" placeholder="yourname@example.com" />
      </div>
      <div class="form-group">
        <label>Inquiry Details</label>
        <textarea
          rows="5"
          [(ngModel)]="formData.details"
          placeholder="Tell us about the property..."
        ></textarea>
      </div>
      <button class="btn-submit" (click)="sendInquiry()">Send Inquiry</button>
    </div>
  </div>
</section>
