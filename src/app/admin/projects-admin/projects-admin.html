<div class="admin-page">
  <div class="admin-page-header">
    <a routerLink="/admin" class="back-btn">
      <i class="ri-arrow-left-line"></i> Back
    </a>
    <h1>Projects</h1>
    <button class="add-btn" (click)="startAdd()">+ Add Project</button>
  </div>

  @if (success) {
    <div class="success-msg">Saved successfully!</div>
  }

  @if (!editingProject && !isAdding) {
    <table class="admin-table">
      <thead>
        <tr>
          <th>Image</th>
          <th>Title</th>
          <th>Category</th>
          <th>Location</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (project of projects; track project._id) {
          <tr>
            <td><img [src]="project.image" [alt]="project.title"></td>
            <td>{{ project.title }}</td>
            <td>{{ project.category }}</td>
            <td>{{ project.location }}</td>
            <td>
              <div class="table-actions">
                <button class="add-btn" (click)="startEdit(project)">Edit</button>
                <button class="delete-btn" (click)="deleteProject(project._id)">Delete</button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }

  @if (editingProject || isAdding) {
    <div class="admin-form">
      <div class="form-group">
        <label>Title</label>
        <input type="text" [(ngModel)]="currentProject.title">
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" [(ngModel)]="currentProject.location">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea rows="4" [(ngModel)]="currentProject.description"></textarea>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select [(ngModel)]="currentProject.category">
          <option value="residential">Residential</option>
          <option value="commercial">Commercial</option>
          <option value="coastal">Coastal</option>
        </select>
      </div>
      <div class="form-group">
        <label>Image</label>
        <div class="image-upload">
          <img [src]="imagePreview || currentProject.image" alt="Project Image" class="preview-img">
          <input type="file" accept="image/*" (change)="onFileSelected($event)">
        </div>
      </div>
      <div class="form-actions">
        <button class="save-btn" (click)="save()" [disabled]="loading">
          {{ loading ? 'Saving...' : 'Save' }}
        </button>
        <button class="delete-btn" (click)="cancelEdit()">Cancel</button>
      </div>
    </div>
  }
</div>
