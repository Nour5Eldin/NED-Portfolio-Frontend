<div class="admin-page">
  <div class="admin-page-header">
    <a routerLink="/admin" class="back-btn">
      <i class="ri-arrow-left-line"></i> Back
    </a>
    <h1>Contact Section</h1>
  </div>

  <div class="admin-form">
    @if (success) {
      <div class="success-msg">Saved successfully!</div>
    }

    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" [(ngModel)]="contactData.phoneNumber">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="contactData.email">
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" [(ngModel)]="contactData.address">
    </div>

    <div class="form-group">
      <label>Map Image</label>
      <div class="image-upload">
        <img [src]="imagePreview || contactData.mapImage" alt="Map" class="preview-img">
        <input type="file" accept="image/*" (change)="onFileSelected($event)">
      </div>
    </div>

    <button class="save-btn" (click)="save()" [disabled]="loading">
      {{ loading ? 'Saving...' : 'Save Changes' }}
    </button>
  </div>

  <div class="section-divider">
    <h3>Inquiries</h3>
  </div>

  <table class="admin-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Message</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (inquiry of inquiries; track inquiry._id) {
        <tr>
          <td>{{ inquiry.fullName }}</td>
          <td>{{ inquiry.email }}</td>
          <td>{{ inquiry.details | slice:0:50 }}...</td>
          <td>{{ inquiry.createdAt | date:'short' }}</td>
          <td>
            <button class="delete-btn" (click)="deleteInquiry(inquiry._id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
